name: Build & Release PixMirror

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release (e.g. 0.1.0)"
        required: true
        type: string
      draft:
        description: "Create as draft release"
        required: false
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  release-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: Set version
        shell: pwsh
        run: |
          $v = "${{ inputs.version }}"
          if ($v -notmatch '^\d+\.\d+\.\d+$') {
            throw "Version must look like 1.2.3 (got: $v)"
          }

          (Get-Content package.json -Raw) `
            -replace '"version"\s*:\s*"[^"]+"', "`"version`": `"$v`"" `
            | Set-Content package.json -NoNewline

          (Get-Content src-tauri/tauri.conf.json -Raw) `
            -replace '"version"\s*:\s*"[^"]+"', "`"version`": `"$v`"" `
            | Set-Content src-tauri/tauri.conf.json -NoNewline

          Write-Host "Version set to $v"

      - name: Install frontend dependencies
        run: npm ci

      - name: Fetch scrcpy / adb binaries
        run: npm run setup:binaries

      - name: Build and publish release
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: v__VERSION__
          releaseName: PixMirror v__VERSION__
          releaseBody: |
            ## PixMirror v__VERSION__

            Windows installer for mirroring an Android phone over USB.

            ### Downloads
            - `PixMirror_*_x64-setup.exe` — NSIS installer (recommended)
            - `PixMirror_*_x64_en-US.msi` — MSI installer

            ### Notes
            - Enable USB debugging on the phone
            - Use a data USB cable
            - Windows may show SmartScreen until the app is code-signed
          releaseDraft: ${{ inputs.draft }}
          prerelease: false
